<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配手机 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的简易网页</title>
    <style>
        /* 页面美化 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f0f7ff;
            font-family: "微软雅黑", sans-serif;
            text-align: center;
            padding-top: 80px;
        }
        .box {
            width: 500px;
            margin: 0 auto;
            background: white;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 15px #c8e0ff;
        }
        h1 {
            color: #2563eb;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #444;
            margin: 10px 0;
        }
        button {
            margin-top: 20px;
            padding: 10px 26px;
            font-size: 17px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>欢迎来到你乃哥的网页</h1>
        <p>这是第一个自己写的静态网页</p>
        <p>点击下方按钮有交互效果</p>
        <button id="btn">点我弹出文字</button>
    </div>

    <!-- JS交互代码 -->
    <script>
        const btn = document.getElementById('btn');
        btn.onclick = function() {
            alert('你成功做出带交互的网页啦！');
        }
    </script>
</body>
</html>
